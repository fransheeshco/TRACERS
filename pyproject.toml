[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracers"
version = "0.1.0"
description = "Audio tensor preprocessing for rhythm-chart generation"
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg>=0.6",
    "numpy>=2.1",
    "soundfile>=0.13",
    "torch>=2.15",
    "torchaudio>=2.11.1",
    "hydra-core",
    "wandb",
    "tqdm"
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
preprocess-audio = "tracers.audio.preprocess:main"
inspect-tensors = "tracers.audio.inspect:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
