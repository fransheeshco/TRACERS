experiment:
  num_epochs: 20

  checkpoint_path: checkpoints
  resume_from: notebooks/checkpoints/best.pt

  log_to_wandb: true
  wandb_project: tracer
  run_name: tracer-np-augment-4-lr5e-5

hyperparams:
  learning_rate: 0.00005
  weight_decay: 0.01

  np_fl_gamma: 2.0
  np_fl_weight: 0.8

  ns_fl_gamma: 3.0
  ns_fl_weight: 0.5

  np_loss_multiplier: 7.0

  bp_emb_dim: 32
  bn_emb_dim: 16
  diff_emb_dim: 16

  np_hidden_size: 256
  np_num_layers: 2

  ns_pre_proj_size: 32
  ns_hidden_size: 256
  ns_num_layers: 2

  action_emb_dim: 32

  np_prob_emb_dim: 16

  segment_frames: 2000

  max_len: 2000

  batch_size: 6

  global_dim: 128
  global_tokens: 512
  global_heads: 4
  global_num_layers: 2
  global_ff_dim: 256
  global_dropout: 0.1
